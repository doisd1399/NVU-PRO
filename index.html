<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="transparent" />
    <title>NVU</title>
    <style>
      :root { --nvu-page: #f7f9fa; --nvu-surface: #fff; color-scheme: light; }
      :root.dark { --nvu-page: #10151c; --nvu-surface: #1a1f26; color-scheme: dark; }
      html, body, #root { min-height: 100%; margin: 0; background: var(--nvu-page); }
    </style>
    <script
      src="https://accounts.google.com/gsi/client"
      async
      defer
    ></script>
    <script>
      try {
        var nvuTheme =
          localStorage.getItem("frotalog-theme") === "dark" ? "dark" : "light";
        document.documentElement.classList.add(nvuTheme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", "transparent");
      } catch (error) {
        document.documentElement.classList.add("light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
