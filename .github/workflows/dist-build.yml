name: Dist Build

on:
  workflow_dispatch:
  push:
    branches: [dist-build]

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Zip dist
        run: |
          rm -f NVU-PRO-2.3.198-dist.zip
          (cd dist && zip -qr ../NVU-PRO-2.3.198-dist.zip .)
          ls -lh NVU-PRO-2.3.198-dist.zip

      - name: Lint result
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: echo "Lint result - $LINT_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: NVU-PRO-2.3.198-dist
          path: NVU-PRO-2.3.198-dist.zip
          if-no-files-found: error
