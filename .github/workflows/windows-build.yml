name: NVU Windows candidate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm --prefix desktop/windows ci
      - run: npm run windows:plugin
      - run: npm run lint
      - run: npm run test:windows
      - run: npm run windows:installer
      - uses: actions/upload-artifact@v4
        with:
          name: nvu-windows-unsigned-candidate
          path: |
            artifacts/windows/*Setup.exe
            desktop/windows/plugin/bin/nvu_scs_telemetry.dll
