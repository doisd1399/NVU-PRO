apply plugin: 'com.android.application'

def releaseStoreFilePath = project.findProperty("RELEASE_STORE_FILE") ?: System.getenv("RELEASE_STORE_FILE")
def releaseStorePassword = project.findProperty("RELEASE_STORE_PASSWORD") ?: System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyAlias = project.findProperty("RELEASE_KEY_ALIAS") ?: System.getenv("RELEASE_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("RELEASE_KEY_PASSWORD") ?: System.getenv("RELEASE_KEY_PASSWORD")
def releaseSigningConfigured = [releaseStoreFilePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.toString().trim().isEmpty() }

android {
    namespace = "com.nvu.operacional"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nvu.operacional"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 359
        versionName "1.0.359"
        // OTA channel is pinned to this native binary version. Future Web bundles
        // must be published to the matching channel and pass signature checks.
        resValue "string", "capawesome_live_update_default_channel", "production-" + versionCode
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
                // final Release artifact is explicitly produced by AGP with
                // apksigner v2/v3 signing; no external re-packaging or
                // post-signing step is used.
            }
        }
    }
    buildTypes {
        debug {
            // Local-only diagnostic variant: keep the production applicationId and
            // certificate so `adb install -r` preserves the HF208 data store.
            // This does not change the release build or any published artifact.
            debuggable true
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Bundled Latin OCR model: works locally/offline once the APK is installed.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // Native GTO trip sync. Firebase Authentication supplies the current driver
    // identity and callable Functions performs the server-authoritative write.
    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-functions"
    implementation "com.google.firebase:firebase-firestore"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
def releaseTaskRequested = gradle.startParameter.taskNames.any { task ->
    task.toLowerCase(Locale.ROOT).contains('release')
}
if (servicesJSON.exists() && servicesJSON.text.trim()) {
    apply plugin: 'com.google.gms.google-services'
} else if (releaseTaskRequested) {
    throw new GradleException('google-services.json é obrigatório para o APK Release com login Google nativo.')
} else {
    logger.lifecycle('google-services.json ausente: build não-Release segue sem Firebase nativo.')
}

// Keep Java source decoding deterministic on Windows PCs. Project sources are UTF-8
// and include canonical Portuguese destination spellings with accents.
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
